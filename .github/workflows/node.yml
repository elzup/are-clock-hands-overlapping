name: Node CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/readme.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/readme.md'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      # version is read from packageManager in package.json
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      # Node 26 (LTS) is the only target: Temporal is available without flags
      - name: Use Node.js from .node-version
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: 'pnpm'
      - name: Assert Temporal is available
        run: node -e 'if (typeof Temporal !== "object") process.exit(1)'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint with biome
        run: pnpm lint
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Build
        run: pnpm build
      - name: Test with coverage
        run: pnpm test:cov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
